{% extends "base.html" %}
{% block content %}

<style>
    .nav-top-bar {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 28px);
        max-width: 520px;
        z-index: 1000;
        background: rgba(255,255,255,0.97);
        backdrop-filter: blur(14px);
        border-radius: 18px;
        padding: 14px 16px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.14);
    }
    .route-info-card {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 28px);
        max-width: 480px;
        z-index: 1000;
        background: white;
        border-radius: 20px;
        padding: 18px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.16);
        display: none;
    }
    .stat-box { text-align: center; flex: 1; }
    .stat-box .label { font-size: 0.7rem; color: #9ca3af; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .stat-box .value { font-size: 0.95rem; font-weight: 700; color: #1e293b; }
    .weather-strip { display: flex; align-items: center; gap: 10px; padding: 8px 0 0; margin-top: 8px; border-top: 1px solid #f1f5f9; }
    #find-route-btn { white-space: nowrap; }
</style>

<div class="position-relative" style="height: calc(100vh - 125px); width: 100%; overflow: hidden;">

    <!-- Top Floating Bar -->
    <div class="nav-top-bar">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="me-2 overflow-hidden">
                <div class="fw-bold text-dark text-truncate" style="font-size:0.95rem">{{ place.name }}</div>
                <small id="nav-status" class="text-muted">📍 Loading map...</small>
            </div>
            <button id="find-route-btn" onclick="findRoute()"
                    class="btn btn-primary rounded-pill fw-bold shadow-sm px-3 py-2 flex-shrink-0"
                    style="font-size:0.85rem">
                <i class="fa-solid fa-route me-1"></i> Find Route
            </button>
        </div>
        <!-- Weather strip (shown after load) -->
        <div id="weather-strip" class="weather-strip" style="display:none">
            <span id="w-icon" style="font-size:1.4rem"></span>
            <div>
                <span id="w-temp" class="fw-bold small text-dark"></span>
                <span id="w-desc" class="text-muted small ms-1"></span>
            </div>
            <span id="w-tip" class="badge ms-auto rounded-pill" style="font-size:0.68rem"></span>
        </div>
    </div>

    <!-- Map Container -->
    <div id="place-map" class="h-100 w-100"></div>

    <!-- Bottom Route Info Card -->
    <div class="route-info-card" id="route-info">
        <div class="d-flex gap-2 mb-3" id="route-stats">
            <div class="stat-box">
                <div class="label">Distance</div>
                <div class="value" id="dist-val">—</div>
            </div>
            <div style="width:1px;background:#e2e8f0"></div>
            <div class="stat-box">
                <div class="label">Drive Time</div>
                <div class="value" id="time-val">—</div>
            </div>
            <div style="width:1px;background:#e2e8f0" id="traffic-div" style="display:none"></div>
            <div class="stat-box" id="traffic-box" style="display:none">
                <div class="label">🚦 With Traffic</div>
                <div class="value text-danger" id="traffic-val">—</div>
            </div>
        </div>

        <div class="d-flex gap-2 mb-2">
            <button class="btn btn-light rounded-pill flex-fill fw-bold shadow-sm border"
                    onclick="useBelagaviStart()" style="font-size:0.82rem">
                🏙️ Belagavi Start
            </button>
            <button class="btn btn-light rounded-pill flex-fill fw-bold shadow-sm border"
                    onclick="recenterDest()" style="font-size:0.82rem">
                🎯 Re-center
            </button>
        </div>
        <a href="https://www.google.com/maps/dir/?api=1&destination={{ place.lat }},{{ place.lon }}"
           target="_blank"
           class="btn btn-success w-100 rounded-pill fw-bold shadow-sm"
           style="font-size:0.85rem">
            🗺️ Open Google Maps App
        </a>
    </div>
</div>

<script>
const DEST_LAT = {{ place.lat | default("null") }};
const DEST_LON = {{ place.lon | default("null") }};
const PLACE_NAME = {{ place.name | tojson }};
const BELAGAVI_LAT = 15.8626;
const BELAGAVI_LON = 74.5177;

let map, userMarker, routePolyline, destMarker;

// ── Polyline decoder (Google encoded polyline format) ──────────────────
function decodePolyline(encoded) {
    const pts = [];
    let idx = 0, lat = 0, lng = 0;
    while (idx < encoded.length) {
        let b, shift = 0, result = 0;
        do { b = encoded.charCodeAt(idx++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lat += (result & 1) ? ~(result >> 1) : (result >> 1);
        shift = 0; result = 0;
        do { b = encoded.charCodeAt(idx++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lng += (result & 1) ? ~(result >> 1) : (result >> 1);
        pts.push({ lat: lat / 1e5, lng: lng / 1e5 });
    }
    return pts;
}

// ── Map init — show only destination marker ─────────────────────────────
function initNavigationMap() {
    if (!window.google || DEST_LAT === null) return;

    map = new google.maps.Map(document.getElementById('place-map'), {
        center: { lat: DEST_LAT, lng: DEST_LON },
        zoom: 14,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: false,
        gestureHandling: 'greedy',
        styles: [{ featureType: 'poi', elementType: 'labels', stylers: [{ visibility: 'off' }] }]
    });

    destMarker = new google.maps.Marker({
        position: { lat: DEST_LAT, lng: DEST_LON },
        map: map,
        title: PLACE_NAME,
        animation: google.maps.Animation.DROP
    });

    setStatus('📍 Exact location of ' + PLACE_NAME);
    loadWeather();
}

function setStatus(msg) {
    const el = document.getElementById('nav-status');
    if (el) el.textContent = msg;
}

// ── Weather (Open-Meteo, free) ──────────────────────────────────────────
function loadWeather() {
    if (!DEST_LAT) return;
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${DEST_LAT}&longitude=${DEST_LON}&current_weather=true`)
        .then(r => r.json())
        .then(data => {
            if (!data.current_weather) return;
            const { temperature: temp, weathercode: code } = data.current_weather;
            const icons = { 0:'☀️', 1:'🌤️', 2:'⛅', 3:'☁️', 45:'🌫️', 48:'🌫️', 51:'🌦️', 61:'🌧️', 71:'❄️', 80:'🌦️', 95:'⛈️' };
            const descs = { 0:'Clear', 1:'Mostly Clear', 2:'Partly Cloudy', 3:'Overcast', 45:'Foggy', 48:'Foggy', 51:'Drizzle', 61:'Rain', 71:'Snow', 80:'Showers', 95:'Thunderstorm' };
            const icon = icons[code] || (code >= 51 && code <= 67 ? '🌧️' : code >= 80 ? '🌦️' : '☀️');
            const desc = descs[code] || (code >= 51 ? 'Rainy' : 'Clear');

            let tip = '✅ Great weather!', tipColor = '#16a34a';
            if (temp > 37) { tip = '🔥 Very hot! Stay hydrated'; tipColor = '#dc2626'; }
            else if (temp > 32) { tip = '🌡️ Hot — carry water'; tipColor = '#d97706'; }
            else if (code >= 51 && code <= 95) { tip = '☔ Carry umbrella'; tipColor = '#2563eb'; }

            document.getElementById('w-icon').textContent = icon;
            document.getElementById('w-temp').textContent = `${temp}°C`;
            document.getElementById('w-desc').textContent = desc;
            const tipEl = document.getElementById('w-tip');
            tipEl.textContent = tip;
            tipEl.style.background = tipColor + '20';
            tipEl.style.color = tipColor;
            tipEl.style.border = `1px solid ${tipColor}40`;
            document.getElementById('weather-strip').style.display = 'flex';
        })
        .catch(() => {});
}

// ── Find Route ─────────────────────────────────────────────────────────
function findRoute() {
    if (!map) return;
    const btn = document.getElementById('find-route-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status"></span>Locating...';
    setStatus('Getting your location...');

    if (!navigator.geolocation) {
        calcRoute(BELAGAVI_LAT, BELAGAVI_LON, true);
        return;
    }
    navigator.geolocation.getCurrentPosition(
        pos => {
            const { latitude: lat, longitude: lng } = pos.coords;
            // Sanity check — if outside India, use Belagavi
            if (lat < 5 || lat > 37 || lng < 65 || lng > 98) {
                calcRoute(BELAGAVI_LAT, BELAGAVI_LON, true);
            } else {
                calcRoute(lat, lng, false);
            }
        },
        () => calcRoute(BELAGAVI_LAT, BELAGAVI_LON, true),
        { timeout: 8000, enableHighAccuracy: true }
    );
}

async function calcRoute(userLat, userLng, isFallback) {
    setStatus(isFallback ? 'Using Belagavi CBT as start...' : 'Calculating route...');

    // Place or move user marker
    const userPos = { lat: userLat, lng: userLng };
    if (userMarker) {
        userMarker.setPosition(userPos);
    } else {
        userMarker = new google.maps.Marker({
            position: userPos,
            map: map,
            title: isFallback ? 'Belagavi CBT (Start)' : 'Your Location',
            draggable: true,
            animation: google.maps.Animation.DROP,
            icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 10,
                fillColor: '#2563eb',
                fillOpacity: 1,
                strokeColor: '#ffffff',
                strokeWeight: 3
            }
        });
        userMarker.addListener('dragend', () => {
            const p = userMarker.getPosition();
            calcRoute(p.lat(), p.lng(), false);
        });
    }

    const btn = document.getElementById('find-route-btn');

    try {
        // Call server-side proxy (keeps Directions API key hidden)
        const res = await fetch(`/api/directions?origin=${userLat},${userLng}&destination=${DEST_LAT},${DEST_LON}`);
        const data = await res.json();

        if (data.status === 'OK' && data.routes && data.routes.length > 0) {
            const route = data.routes[0];
            const leg = route.legs[0];

            // Clear previous route polyline
            if (routePolyline) routePolyline.setMap(null);

            // Decode and draw actual road route
            const path = decodePolyline(route.overview_polyline.points);
            routePolyline = new google.maps.Polyline({
                path,
                map,
                strokeColor: '#2563eb',
                strokeWeight: 5,
                strokeOpacity: 0.9,
                zIndex: 2
            });

            // Fit bounds to show full route
            const bounds = new google.maps.LatLngBounds();
            bounds.extend(userPos);
            bounds.extend({ lat: DEST_LAT, lng: DEST_LON });
            map.fitBounds(bounds, { top: 130, bottom: 220, left: 20, right: 20 });

            // Update stats
            document.getElementById('dist-val').textContent = leg.distance.text;
            document.getElementById('time-val').textContent = leg.duration.text;

            // Traffic info
            if (leg.duration_in_traffic && leg.duration_in_traffic.value > leg.duration.value + 120) {
                document.getElementById('traffic-val').textContent = leg.duration_in_traffic.text;
                document.getElementById('traffic-box').style.display = 'block';
                document.getElementById('traffic-div').style.display = 'block';
            } else {
                document.getElementById('traffic-box').style.display = 'none';
                document.getElementById('traffic-div').style.display = 'none';
            }

            document.getElementById('route-info').style.display = 'block';
            setStatus(isFallback ? '🚗 Route from Belagavi CBT' : '🚗 Route calculated from your location');
        } else {
            throw new Error(data.error_message || data.status || 'No route found');
        }
    } catch (err) {
        console.error('Route error:', err);
        setStatus('⚠️ Routing failed — try "Open Google Maps App"');
    }

    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-route me-1"></i> Find Route';
}

function useBelagaviStart() {
    calcRoute(BELAGAVI_LAT, BELAGAVI_LON, true);
}

function recenterDest() {
    if (map) { map.setCenter({ lat: DEST_LAT, lng: DEST_LON }); map.setZoom(14); }
}

// ── Boot ──────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
    if (window.googleMapsLoaded) initNavigationMap();
    else window.onGoogleMapsReady = initNavigationMap;
});
</script>
{% endblock %}
