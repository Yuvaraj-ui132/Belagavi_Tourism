{% extends "base.html" %}
{% block content %}

<style>
    .nav-top-bar {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 28px);
        max-width: 520px;
        z-index: 1000;
        background: rgba(255,255,255,0.97);
        backdrop-filter: blur(14px);
        border-radius: 18px;
        padding: 14px 16px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.14);
    }
    .route-info-card {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 28px);
        max-width: 480px;
        z-index: 1000;
        background: white;
        border-radius: 20px;
        padding: 18px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.16);
        display: none;
    }
    .stat-box { text-align: center; flex: 1; }
    .stat-box .label { font-size: 0.7rem; color: #9ca3af; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .stat-box .value { font-size: 0.95rem; font-weight: 700; color: #1e293b; }
    .weather-strip { display: flex; align-items: center; gap: 10px; padding: 8px 0 0; margin-top: 8px; border-top: 1px solid #f1f5f9; }
    #find-route-btn { white-space: nowrap; }
</style>

<div class="position-relative" style="height: calc(100vh - 125px); width: 100%; overflow: hidden;">

    <!-- Top Floating Bar -->
    <div class="nav-top-bar">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="me-2 overflow-hidden">
                <div class="fw-bold text-dark text-truncate" style="font-size:0.95rem">{{ place.name }}</div>
                <small id="nav-status" class="text-muted">📍 Loading map...</small>
            </div>
            <button id="find-route-btn" onclick="findRoute()"
                    class="btn btn-primary rounded-pill fw-bold shadow-sm px-3 py-2 flex-shrink-0"
                    style="font-size:0.85rem">
                <i class="fa-solid fa-route me-1"></i> Find Route
            </button>
        </div>
        <!-- Weather strip (shown after load) -->
        <div id="weather-strip" class="weather-strip" style="display:none">
            <span id="w-icon" style="font-size:1.4rem"></span>
            <div>
                <span id="w-temp" class="fw-bold small text-dark"></span>
                <span id="w-desc" class="text-muted small ms-1"></span>
            </div>
            <span id="w-tip" class="badge ms-auto rounded-pill" style="font-size:0.68rem"></span>
        </div>
    </div>

    <!-- Map Container -->
    <div id="place-map" class="h-100 w-100"></div>

    <!-- Bottom Route Info Card -->
    <div class="route-info-card" id="route-info">
        <div class="d-flex gap-2 mb-3" id="route-stats">
            <div class="stat-box">
                <div class="label">Distance</div>
                <div class="value" id="dist-val">—</div>
            </div>
            <div style="width:1px;background:#e2e8f0"></div>
            <div class="stat-box">
                <div class="label">Drive Time</div>
                <div class="value" id="time-val">—</div>
            </div>
            <div style="width:1px;background:#e2e8f0" id="traffic-div" style="display:none"></div>
            <div class="stat-box" id="traffic-box" style="display:none">
                <div class="label">🚦 With Traffic</div>
                <div class="value text-danger" id="traffic-val">—</div>
            </div>
        </div>

        <div class="d-flex gap-2 mb-2">
            <button class="btn btn-light rounded-pill flex-fill fw-bold shadow-sm border"
                    onclick="useBelagaviStart()" style="font-size:0.82rem">
                🏙️ Belagavi Start
            </button>
            <button class="btn btn-light rounded-pill flex-fill fw-bold shadow-sm border"
                    onclick="recenterDest()" style="font-size:0.82rem">
                🎯 Re-center
            </button>
        </div>
        <!-- Dynamic Open Route button — origin set from geolocation at runtime -->
        <button id="open-maps-btn"
                onclick="openGoogleMapsRoute()"
                class="btn btn-success w-100 rounded-pill fw-bold shadow-sm"
                style="font-size:0.85rem">
            🗺️ Open Route in Google Maps
        </button>
    </div>
</div>

<script>
// ── Constants ──────────────────────────────────────────────────────────────
const DEST_LAT   = {{ place.lat | default("null") }};
const DEST_LON   = {{ place.lon | default("null") }};
const PLACE_NAME = {{ place.name | tojson }};
const BELAGAVI_LAT = 15.8626;
const BELAGAVI_LON = 74.5177;
const BELAGAVI_LABEL = 'Belagavi, Karnataka';

let map, userMarker, routePolyline, destMarker;
let _lastUserLat = null, _lastUserLng = null;  // updated each time we get location

// ── Utilities ──────────────────────────────────────────────────────────────
function setStatus(msg) {
    const el = document.getElementById('nav-status');
    if (el) el.textContent = msg;
}

function isValidCoord(lat, lng) {
    return typeof lat === 'number' && typeof lng === 'number'
        && !isNaN(lat) && !isNaN(lng)
        && lat >= -90 && lat <= 90
        && lng >= -180 && lng <= 180;
}

// ── Build a Google Maps directions URL (ALWAYS works, no API key needed) ──
function buildGoogleMapsUrl(originLat, originLng, isFallback) {
    let origin;
    if (!isFallback && isValidCoord(originLat, originLng)) {
        origin = `${originLat},${originLng}`;
    } else {
        origin = BELAGAVI_LABEL;
    }

    let destination;
    if (isValidCoord(DEST_LAT, DEST_LON)) {
        destination = `${DEST_LAT},${DEST_LON}`;
    } else {
        // Fallback: use place name + Belagavi for geocoding
        destination = encodeURIComponent(`${PLACE_NAME} Belagavi Karnataka`);
    }

    const url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=driving`;
    console.log('[Nav] Google Maps URL:', url);
    return url;
}

// ── Open Google Maps with live geolocation origin ──────────────────────────
function openGoogleMapsRoute() {
    if (_lastUserLat !== null && isValidCoord(_lastUserLat, _lastUserLng)) {
        // We already have their location from a previous findRoute() call
        window.open(buildGoogleMapsUrl(_lastUserLat, _lastUserLng, false), '_blank');
        return;
    }
    // Try to get location now
    if (!navigator.geolocation) {
        console.log('[Nav] Geolocation not supported — using Belagavi fallback');
        window.open(buildGoogleMapsUrl(null, null, true), '_blank');
        return;
    }
    const btn = document.getElementById('open-maps-btn');
    if (btn) { btn.disabled = true; btn.textContent = '📍 Getting location...'; }

    navigator.geolocation.getCurrentPosition(
        pos => {
            const { latitude: lat, longitude: lng } = pos.coords;
            console.log('[Nav] Got location for Maps URL:', lat, lng);
            _lastUserLat = lat;
            _lastUserLng = lng;
            if (btn) { btn.disabled = false; btn.textContent = '🗺️ Open Route in Google Maps'; }
            // Validate: must be within India bounds
            if (lat < 5 || lat > 37 || lng < 65 || lng > 98) {
                console.warn('[Nav] Location outside India — using Belagavi fallback');
                window.open(buildGoogleMapsUrl(null, null, true), '_blank');
            } else {
                window.open(buildGoogleMapsUrl(lat, lng, false), '_blank');
            }
        },
        err => {
            console.warn('[Nav] Geolocation denied/failed for Maps URL:', err.message);
            if (btn) { btn.disabled = false; btn.textContent = '🗺️ Open Route in Google Maps'; }
            window.open(buildGoogleMapsUrl(null, null, true), '_blank');
        },
        { timeout: 6000, enableHighAccuracy: false }
    );
}

// ── Polyline decoder (Google encoded polyline format) ──────────────────────
function decodePolyline(encoded) {
    const pts = [];
    let idx = 0, lat = 0, lng = 0;
    while (idx < encoded.length) {
        let b, shift = 0, result = 0;
        do { b = encoded.charCodeAt(idx++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lat += (result & 1) ? ~(result >> 1) : (result >> 1);
        shift = 0; result = 0;
        do { b = encoded.charCodeAt(idx++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lng += (result & 1) ? ~(result >> 1) : (result >> 1);
        pts.push({ lat: lat / 1e5, lng: lng / 1e5 });
    }
    return pts;
}

// ── Map init ────────────────────────────────────────────────────────────────
function initNavigationMap() {
    if (!window.google) { console.error('[Nav] Google Maps JS not loaded'); return; }
    if (!isValidCoord(DEST_LAT, DEST_LON)) {
        console.warn('[Nav] No valid destination coordinates — showing name-based route button');
        setStatus('📍 ' + PLACE_NAME + ' (approximate location)');
        loadWeather();
        return;
    }

    map = new google.maps.Map(document.getElementById('place-map'), {
        center: { lat: DEST_LAT, lng: DEST_LON },
        zoom: 14,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: false,
        gestureHandling: 'greedy',
        styles: [{ featureType: 'poi', elementType: 'labels', stylers: [{ visibility: 'off' }] }]
    });

    destMarker = new google.maps.Marker({
        position: { lat: DEST_LAT, lng: DEST_LON },
        map: map,
        title: PLACE_NAME,
        animation: google.maps.Animation.DROP
    });

    setStatus('📍 Exact location of ' + PLACE_NAME);
    loadWeather();
}

// ── Weather (Open-Meteo, free, no key needed) ──────────────────────────────
function loadWeather() {
    if (!isValidCoord(DEST_LAT, DEST_LON)) return;
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${DEST_LAT}&longitude=${DEST_LON}&current_weather=true`)
        .then(r => r.json())
        .then(data => {
            if (!data.current_weather) return;
            const { temperature: temp, weathercode: code } = data.current_weather;
            const icons = { 0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',61:'🌧️',71:'❄️',80:'🌦️',95:'⛈️' };
            const descs = { 0:'Clear',1:'Mostly Clear',2:'Partly Cloudy',3:'Overcast',45:'Foggy',48:'Foggy',51:'Drizzle',61:'Rain',71:'Snow',80:'Showers',95:'Thunderstorm' };
            const icon = icons[code] || (code >= 51 && code <= 67 ? '🌧️' : code >= 80 ? '🌦️' : '☀️');
            const desc = descs[code] || (code >= 51 ? 'Rainy' : 'Clear');
            let tip = '✅ Great weather!', tipColor = '#16a34a';
            if (temp > 37)                        { tip = '🔥 Very hot! Stay hydrated'; tipColor = '#dc2626'; }
            else if (temp > 32)                   { tip = '🌡️ Hot — carry water';      tipColor = '#d97706'; }
            else if (code >= 51 && code <= 95)    { tip = '☔ Carry umbrella';          tipColor = '#2563eb'; }
            document.getElementById('w-icon').textContent  = icon;
            document.getElementById('w-temp').textContent  = `${temp}°C`;
            document.getElementById('w-desc').textContent  = desc;
            const tipEl = document.getElementById('w-tip');
            tipEl.textContent   = tip;
            tipEl.style.background = tipColor + '20';
            tipEl.style.color      = tipColor;
            tipEl.style.border     = `1px solid ${tipColor}40`;
            document.getElementById('weather-strip').style.display = 'flex';
        })
        .catch(err => console.warn('[Nav] Weather fetch failed:', err));
}

// ── Find Route (triggered by Find Route button) ────────────────────────────
function findRoute() {
    if (!map) {
        // No map (coords missing) — open Google Maps directly
        openGoogleMapsRoute();
        return;
    }
    const btn = document.getElementById('find-route-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status"></span>Locating...';
    setStatus('Getting your location...');

    if (!navigator.geolocation) {
        console.log('[Nav] Geolocation not available — using Belagavi fallback');
        calcRoute(BELAGAVI_LAT, BELAGAVI_LON, true);
        return;
    }

    navigator.geolocation.getCurrentPosition(
        pos => {
            const { latitude: lat, longitude: lng } = pos.coords;
            console.log('[Nav] User location:', lat, lng);
            // Validate: must be within India
            if (lat < 5 || lat > 37 || lng < 65 || lng > 98) {
                console.warn('[Nav] Coords outside India bounds — using Belagavi fallback');
                calcRoute(BELAGAVI_LAT, BELAGAVI_LON, true);
            } else {
                _lastUserLat = lat;
                _lastUserLng = lng;
                calcRoute(lat, lng, false);
            }
        },
        err => {
            console.warn('[Nav] Geolocation error:', err.code, err.message);
            calcRoute(BELAGAVI_LAT, BELAGAVI_LON, true);
        },
        { timeout: 8000, enableHighAccuracy: true }
    );
}

// ── Show fallback when Directions API fails ────────────────────────────────
function showFallbackRoute(userLat, userLng, isFallback, reason) {
    console.warn('[Nav] Directions API failed — showing fallback. Reason:', reason);
    const mapsUrl = buildGoogleMapsUrl(userLat, userLng, isFallback);
    setStatus('🗺️ Tap below to open route in Google Maps');

    // Update the route-info card to show a clear open-maps button
    document.getElementById('dist-val').textContent = '—';
    document.getElementById('time-val').textContent = '—';
    document.getElementById('route-info').style.display = 'block';

    // Replace the open-maps button with a direct link
    const btn = document.getElementById('open-maps-btn');
    if (btn) {
        btn.onclick = () => window.open(mapsUrl, '_blank');
        btn.textContent = '🗺️ Open Route in Google Maps';
        btn.disabled = false;
    }
}

// ── Calculate route via server-side proxy ────────────────────────────────
async function calcRoute(userLat, userLng, isFallback) {
    setStatus(isFallback ? '🔄 Using Belagavi as start...' : '🔄 Calculating route...');

    const userPos = { lat: userLat, lng: userLng };

    // Place / update user marker on map
    if (userMarker) {
        userMarker.setPosition(userPos);
    } else {
        userMarker = new google.maps.Marker({
            position: userPos,
            map: map,
            title: isFallback ? 'Belagavi (Start)' : 'Your Location',
            draggable: true,
            animation: google.maps.Animation.DROP,
            icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 10,
                fillColor: '#2563eb',
                fillOpacity: 1,
                strokeColor: '#ffffff',
                strokeWeight: 3
            }
        });
        userMarker.addListener('dragend', () => {
            const p = userMarker.getPosition();
            calcRoute(p.lat(), p.lng(), false);
        });
    }

    const btn = document.getElementById('find-route-btn');

    // Guard: need valid destination coords for API call
    if (!isValidCoord(DEST_LAT, DEST_LON)) {
        console.warn('[Nav] Destination coords missing — skipping API, showing fallback');
        showFallbackRoute(userLat, userLng, isFallback, 'no destination coords');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-route me-1"></i> Find Route';
        return;
    }

    try {
        console.log(`[Nav] Calling /api/directions: origin=${userLat},${userLng} dest=${DEST_LAT},${DEST_LON}`);
        const res  = await fetch(`/api/directions?origin=${userLat},${userLng}&destination=${DEST_LAT},${DEST_LON}`);
        const data = await res.json();
        console.log('[Nav] Directions API status:', data.status);

        if (data.status === 'OK' && data.routes && data.routes.length > 0) {
            const route = data.routes[0];
            const leg   = route.legs[0];

            // Draw route polyline
            if (routePolyline) routePolyline.setMap(null);
            const path = decodePolyline(route.overview_polyline.points);
            routePolyline = new google.maps.Polyline({
                path,
                map,
                strokeColor: '#2563eb',
                strokeWeight: 5,
                strokeOpacity: 0.9,
                zIndex: 2
            });

            // Fit map to full route
            const bounds = new google.maps.LatLngBounds();
            bounds.extend(userPos);
            bounds.extend({ lat: DEST_LAT, lng: DEST_LON });
            map.fitBounds(bounds, { top: 130, bottom: 220, left: 20, right: 20 });

            // Update stats
            document.getElementById('dist-val').textContent = leg.distance.text;
            document.getElementById('time-val').textContent = leg.duration.text;

            // Hide traffic (requires Premium — removed to prevent REQUEST_DENIED)
            document.getElementById('traffic-box').style.display = 'none';
            document.getElementById('traffic-div').style.display = 'none';

            document.getElementById('route-info').style.display = 'block';
            setStatus(isFallback
                ? `🚗 Route from Belagavi — ${leg.distance.text}, ${leg.duration.text}`
                : `🚗 Route from your location — ${leg.distance.text}, ${leg.duration.text}`);

            // Also update the Google Maps button to use correct origin
            const mapsUrl = buildGoogleMapsUrl(userLat, userLng, isFallback);
            const openBtn = document.getElementById('open-maps-btn');
            if (openBtn) openBtn.onclick = () => window.open(mapsUrl, '_blank');

        } else {
            // API returned non-OK status (ZERO_RESULTS, REQUEST_DENIED, etc.)
            console.warn('[Nav] Directions API returned:', data.status, data.error_message || '');
            showFallbackRoute(userLat, userLng, isFallback,
                data.error_message || data.status || 'No route found');
        }
    } catch (err) {
        console.error('[Nav] Directions fetch error:', err);
        showFallbackRoute(userLat, userLng, isFallback, err.message);
    }

    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-route me-1"></i> Find Route';
}

// ── Helper buttons ──────────────────────────────────────────────────────────
function useBelagaviStart() {
    calcRoute(BELAGAVI_LAT, BELAGAVI_LON, true);
}

function recenterDest() {
    if (map && isValidCoord(DEST_LAT, DEST_LON)) {
        map.setCenter({ lat: DEST_LAT, lng: DEST_LON });
        map.setZoom(14);
    }
}

// ── Boot ────────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
    if (window.googleMapsLoaded) initNavigationMap();
    else window.onGoogleMapsReady = initNavigationMap;
});
</script>
{% endblock %}
